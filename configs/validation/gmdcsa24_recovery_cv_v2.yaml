protocol_id: gmdcsa24-recovery-cv-v2
status: predeclared_before_recovery_evaluation
dataset:
  name: GMDCSA-24
  doi: 10.5281/zenodo.12921216
  source_manifest: data/processed/gmdcsa24/manifest.json
historical_boundary:
  figshare_fall29_locked_test_is_opened: true
  figshare_fall29_use: failure-stage diagnosis only
  gmdcsa24_subject_3_is_consumed: true
  gmdcsa24_subject_4_remains_unopened: true
selection:
  partition_unit: subject
  cross_validation_subjects: [1, 2, 3]
  folds:
    - {development: [2, 3], validation: [1]}
    - {development: [1, 3], validation: [2]}
    - {development: [1, 2], validation: [3]}
  locked_test: [4]
  rule: choose one complete profile from aggregate fold results before unlocking subject 4
models:
  variants: [small, nano]
  primary_variant: small
pipeline: posture_multiclass -> ByteTrack -> Temporal -> Event -> Qwen3.5-4B -> Alert
frontends:
  - name: previous_frozen_baseline
    immediate_posture_confirmation: false
  - name: semantic_high_recall
    candidate_on_lying_posture: true
    confirm_on_falling_posture: true
    confirm_on_lying_posture: true
selection_metrics:
  primary: mean_event_f1
  safeguards:
    - minimum_fold_recall
    - total_false_positive_clips
    - worst_fold_specificity
  tie_break:
    - higher_mean_recall
    - fewer_false_positive_clips
    - small_primary_variant
locked_test_gate:
  all_subject_4_videos_required: true
  one_time_only: true
  must_not_influence_selection: true
claims:
  detection_delay_available: false
  reason: clip labels do not contain independently reviewed fall-onset timestamps
